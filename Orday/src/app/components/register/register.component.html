<!-- Barra de navegación -->
<nav class="navbar">
    <div class="logo">
        <h1>Orday</h1>
    </div>
    <div class="auth-buttons">
        <button class="back-btn" (click)="goTo('')">Home</button>
    </div>
</nav>

<!-- Contenido del Registro -->
<div class="container">
    <header>
        <h1>Crea tu cuenta</h1>
        <p>Por favor, completa los siguientes campos para registrarte en Orday.</p>
    </header>

    <form class="register-form">
        
        <!-- Nombre -->
        <div class="form-group">
            <input type="text" placeholder="Nombre completo" [(ngModel)]="name"/>
        </div>

        <!-- Correo electrónico -->
        <div class="form-group">
            <input type="email" placeholder="Correo electrónico"  [(ngModel)]="email"/>
        </div>

        <!-- Contraseña -->
        <div class="form-group password-group">
            <input type="password" placeholder="Contraseña"  [(ngModel)]="password"/>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="form-group password-group">
            <input type="password" placeholder="Confirmar Contraseña"/>
        </div>

        <!-- Botón de registro -->
        <button type="submit" class="register-btn" (click)="register()">Registrarse</button>

        <p style="margin-top: 1rem;">¿Ya tienes cuenta? <button class="login-btn" (click) = "goTo('login')">Inicia sesión</button></p>
    </form>
</div>
